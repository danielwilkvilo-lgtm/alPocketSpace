<script>
// ============ STATE ============
let apiKey = localStorage.getItem('alpocket_key') || '';
let audioCtx = null;
let analyser = null;
let source = null;
let animFrame = null;
let isPlaying = false;
let sessionNotes = [];

// Init
window.onload = () => {
  if (apiKey) document.getElementById('apiKey').value = apiKey;
  // Dynamiczna zmiana placeholderu na format klucza Google
  document.getElementById('apiKey').placeholder = "AIzaSy...";
  updateFooterTime();
  setInterval(updateFooterTime, 1000);
};

function updateFooterTime() {
  document.getElementById('footerTime').textContent = new Date().toLocaleString('pl-PL');
}

// ============ API KEY ============
function saveKey() {
  const k = document.getElementById('apiKey').value.trim();
  if (!k) return;
  localStorage.setItem('alpocket_key', k);
  apiKey = k;
  setStatus('KEY SAVED', 'accent3');
  setTimeout(() => setStatus('READY', 'accent3'), 1500);
}

// ============ TABS ============
function switchTab(name, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'history') renderHistory();
}

// ============ STATUS ============
function setStatus(text, color) {
  document.getElementById('statusText').textContent = text;
  document.getElementById('statusDot').style.background = `var(--${color})`;
  document.getElementById('statusDot').style.boxShadow = `0 0 8px var(--${color})`;
}

// ============ ANALYZE ============
async function analyze() {
  const key = localStorage.getItem('alpocket_key') || apiKey;
  // Klucze Google Gemini zaczynają się przeważnie od "AIzaSy"
  if (!key || !key.startsWith('AIzaSy')) {
    setOutput('⚠️ Brak klucza API. Wpisz klucz Google Gemini (AIzaSy...) i kliknij ZAPISZ.', false);
    return;
  }

  const prompt = document.getElementById('prompt').value.trim();
  const gpt = document.getElementById('gpt').value.trim();
  const claude = document.getElementById('claude').value.trim();
  const gemini = document.getElementById('gemini').value.trim();

  if (!prompt) {
    setOutput('⚠️ Wpisz prompt przed analizą.', false);
    return;
  }

  const score = [gpt, claude, gemini].filter(t => t.length > 30).length;

  // Save to history
  const entry = {
    time: new Date().toISOString(),
    prompt,
    gpt, claude, gemini,
    score,
    synthesis: null
  };

  setStatus('PROCESSING...', 'accent');
  setOutput('// Analizuję odpowiedzi przez Google Gemini... ⚡', true);

  try {
    const systemPrompt = `Jesteś ekspertem AI Synthesis — analitykiem porównującym odpowiedzi różnych modeli AI.
Twoja rola: przeanalizuj odpowiedzi GPT, Claude i Gemini na dany prompt i stwórz SYNTETYCZNĄ, OPTYMALNĄ odpowiedź.

Format odpowiedzi (używaj tych nagłówków):
📊 OCENA MODELI
[krótka ocena każdego modelu - co wnosi]

⚡ SYNTEZA
[najlepsza możliwa odpowiedź łącząca to co najlepsze]

🎯 REKOMENDACJA
[jedno konkretne zdanie: co robić dalej]

Bądź precyzyjny, konkretny. Nie powtarzaj pytania. Max 300 słów.`;

    const userMsg = `PROMPT: ${prompt}

ODPOWIEDŹ GPT:
${gpt || '[brak]'}

ODPOWIEDŹ CLAUDE:
${claude || '[brak]'}

ODPOWIEDŹ GEMINI:
${gemini || '[brak]'}`;

    // Oficjalny endpoint Google Gemini API (używamy stabilnego i szybkiego modelu gemini-2.5-flash)
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;

    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [{ text: userMsg }]
        }],
        systemInstruction: {
          parts: [{ text: systemPrompt }]
        },
        generationConfig: {
          maxOutputTokens: 1000,
          temperature: 0.4
        }
      })
    });

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || 'Błąd API Gemini');
    }

    const data = await response.json();
    // Wyciąganie tekstu z formatu odpowiedzi Google Gemini
    const synthesis = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Brak odpowiedzi';
    entry.synthesis = synthesis;

    // Save
    let history = JSON.parse(localStorage.getItem('alpocket_history') || '[]');
    history.push(entry);
    localStorage.setItem('alpocket_history', JSON.stringify(history));

    setOutput(synthesis, false);
    setStatus('DONE', 'accent3');

  } catch (e) {
    setOutput('❌ Błąd API Gemini: ' + e.message, false);
    setStatus('ERROR', 'danger');
  }
}

function setOutput(text, loading) {
  const el = document.getElementById('output');
  el.textContent = text;
  el.className = 'output-content' + (loading ? ' loading' : '');
}

// ============ HISTORY ============
function renderHistory() {
  const history = JSON.parse(localStorage.getItem('alpocket_history') || '[]');
  const container = document.getElementById('historyList');

  if (!history.length) {
    container.innerHTML = '<div class="empty-state">// Brak historii. Uruchom analizę w zakładce SYNTEZA.</div>';
    return;
  }

  container.innerHTML = [...history].reverse().map((h, i) => {
    const date = new Date(h.time).toLocaleString('pl-PL');
    const pips = [0,1,2].map(n => `<div class="score-pip ${n < h.score ? 'on' : ''}"></div>`).join('');
    return `
    <div class="history-item" onclick="loadFromHistory(${history.length-1-i})">
      <div class="history-meta">
        <span>${date}</span>
        <span class="history-score">
          <span class="score-fill">${pips}</span>
          &nbsp;${h.score}/3
        </span>
      </div>
      <div class="history-prompt">${h.prompt || '(brak promptu)'}</div>
      ${h.synthesis ? '<div style="font-size:0.65rem;color:var(--accent);margin-top:4px;">✓ AI Synthesis zapisana</div>' : ''}
    </div>`;
  }).join('');
}

function loadFromHistory(idx) {
  const history = JSON.parse(localStorage.getItem('alpocket_history') || '[]');
  const h = history[idx];
  if (!h) return;
  document.getElementById('prompt').value = h.prompt || '';
  document.getElementById('gpt').value = h.gpt || '';
  document.getElementById('claude').value = h.claude || '';
  document.getElementById('gemini').value = h.gemini || '';
  if (h.synthesis) setOutput(h.synthesis, false);
  switchTab('synthesis', document.querySelectorAll('.tab')[0]);
}

function clearHistory() {
  if (!confirm('Wyczyścić całą historię?')) return;
  localStorage.removeItem('alpocket_history');
  setOutput('// Historia wyczyszczona.', false);
  setStatus('RESET', 'danger');
  setTimeout(() => setStatus('READY', 'accent3'), 1500);
}

// ============ KUPR ============
function updateKnob(input, id) {
  document.getElementById(id).textContent = input.value;
  addSessionLog(`${id.replace('Val','')} → ${input.value}`);
}

function addSessionLog(msg) {
  const log = document.getElementById('sessionLog');
  const time = new Date().toLocaleTimeString('pl-PL');
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.innerHTML = `<span>[${time}]</span> ${msg}`;
  if (log.firstChild && log.firstChild.textContent.includes('Brak wpisów')) {
    log.innerHTML = '';
  }
  log.insertBefore(div, log.firstChild);
  sessionNotes.push(`[${time}] ${msg}`);
}

function loadAudio(input) {
  const file = input.files[0];
  if (!file) return;
  const player = document.getElementById('audioPlayer');
  player.src = URL.createObjectURL(file);

  document.getElementById('wavePlaceholder').style.display = 'none';
  addSessionLog(`LOAD: ${file.name} (${(file.size/1024).toFixed(0)}KB)`);

  // Web Audio
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;

  player.onplay = () => {
    if (source) { try { source.disconnect(); } catch(e){} }
    source = audioCtx.createMediaElementSource(player);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    drawWave();
  };

  setStatus('LOADED', 'accent2');
}

function transportPlay() {
  const player = document.getElementById('audioPlayer');
  if (!player.src) { addSessionLog('⚠ Brak pliku audio'); return; }
  if (isPlaying) {
    player.pause();
    isPlaying = false;
    document.getElementById('btnPlay').classList.remove('active');
    document.getElementById('btnPlay').textContent = '▶ PLAY';
    setStatus('PAUSED', 'text-dim');
  } else {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    player.play();
    isPlaying = true;
    document.getElementById('btnPlay').classList.add('active');
    document.getElementById('btnPlay').textContent = '⏸ PAUSE';
    addSessionLog('PLAY');
    setStatus('PLAYING', 'accent2');
  }
}

function transportStop() {
  const player = document.getElementById('audioPlayer');
  player.pause();
  player.currentTime = 0;
  isPlaying = false;
  document.getElementById('btnPlay').classList.remove('active');
  document.getElementById('btnPlay').textContent = '▶ PLAY';
  cancelAnimationFrame(animFrame);
  clearCanvas();
  setStatus('STOPPED', 'text-dim');
  addSessionLog('STOP');
}

function exportSession() {
  const log = sessionNotes.join('\n');
  addSessionLog('SESSION LOGGED →');
  document.getElementById('prompt').value = `[KUPR SESSION]\n${log}`;
  switchTab('synthesis', document.querySelectorAll('.tab')[0]);
}

function drawWave() {
  if (!analyser) return;
  const canvas = document.getElementById('waveCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;

  const bufferLength = analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);

  function draw() {
    animFrame = requestAnimationFrame(draw);
    analyser.getByteFrequencyData(dataArray);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const barWidth = (canvas.width / bufferLength) * 2.5;
    let x = 0;
    for (let i = 0; i < bufferLength; i++) {
      const barHeight = (dataArray[i] / 255) * canvas.height;
      const hue = (i / bufferLength) * 60 + 180;
      ctx.fillStyle = `hsla(${hue}, 80%, 55%, 0.8)`;
      ctx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
      x += barWidth;
    }
  }
  draw();
}

function clearCanvas() {
  const canvas = document.getElementById('waveCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

async function sendKuprToAI() {
  const key = localStorage.getItem('alpocket_key') || apiKey;
  if (!key || !key.startsWith('AIzaSy')) {
    alert('Wpisz klucz API Gemini w polu na górze.');
    return;
  }

  const rev = document.getElementById('reverbVal').textContent;
  const del = document.getElementById('delayVal').textContent;
  const dist = document.getElementById('distortVal').textContent;
  const pitch = document.getElementById('pitchVal').textContent;
  const vol = document.getElementById('volVal').textContent;

  const sessionData = `SESJA KUPR AUDIO FORGE:
Reverb: ${rev}% | Delay: ${del}% | Distortion: ${dist}% | Pitch: ${pitch}st
Volume: ${vol}% | Pan: ${document.getElementById('panVal').textContent}

LOG SESJI:
${sessionNotes.slice(-10).join('\n') || '(brak akcji)'}`;

  document.getElementById('prompt').value = sessionData;
  switchTab('synthesis', document.querySelectorAll('.tab')[0]);
  addSessionLog('SENT TO AI SYNTHESIS');

  setTimeout(() => {
    document.getElementById('gpt').value = '';
    document.getElementById('claude').value = '';
    document.getElementById('gemini').value = '';
  }, 200);
}
</script>
